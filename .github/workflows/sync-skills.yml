name: Sync embedding skills from agent-skills

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout metabase-cursor-plugin
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}

      - name: Clone agent-skills (shallow)
        run: git clone --depth 1 https://github.com/metabase/agent-skills.git /tmp/agent-skills

      - name: Diff skill files
        id: diff
        run: |
          changed=""

          check() {
            local src="/tmp/agent-skills/skills/$1/SKILL.md"
            local dst="plugins/metabase/skills/$1/SKILL.md"
            if [ ! -f "$src" ]; then
              echo "::warning::$src not found in agent-skills — skipping"
              return
            fi
            if ! diff -q "$src" "$dst" > /dev/null 2>&1; then
              cp "$src" "$dst"
              changed="$changed $dst"
              echo "Updated: $dst"
            else
              echo "Up to date: $dst"
            fi
          }

          check metabase-react-sdk-setup
          check metabase-react-sdk-docs

          # Trim leading space
          changed="${changed# }"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated skills
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          git config user.name "Metabase Automation"
          git config user.email "github-automation@metabase.com"

          BRANCH="chore/sync-skills-$(date +%Y%m%d)"

          # Skip if a PR for this branch already exists
          existing=$(gh pr list --head "$BRANCH" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "PR for $BRANCH already exists — skipping"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add plugins/metabase/skills/
          git commit -m "chore: sync embedding skills from agent-skills"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: sync embedding skills from agent-skills" \
            --body "$(printf 'Automated daily sync of skill files from [metabase/agent-skills](https://github.com/metabase/agent-skills).\n\n**Updated files:**\n%s\n\n> Opened automatically by the [sync-skills](/.github/workflows/sync-skills.yml) workflow.' "$CHANGED")" \
            --base main \
            --head "$BRANCH"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.has_changes }}" = "true" ]; then
            echo "### Skills updated — PR opened" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.diff.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### All skills up to date — no PR needed" >> "$GITHUB_STEP_SUMMARY"
          fi
